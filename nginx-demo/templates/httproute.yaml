{{- if .Values.httpRoute.enabled | default false }}  
apiVersion: networking.x-k8s.io/v1alpha1  
kind: HTTPRoute  
metadata:  
  name: {{ .Release.Name }}-http-route  
  namespace: {{ .Release.Namespace }}  
spec:  
  rules:  
    - matches:  
        - path:  
            type: Prefix  
            value: /  
      backendRefs:  
        - name: {{ .Release.Name }}  
          port: 80  
{{- end }}  