apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/snps-krranjan/snps-krranjan/'
    targetRevision: main
    path: demo-gitops/argocd 
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-nginx
  syncPolicy:
    automated:          # optional: auto-sync on git changes; for demo you can toggle it
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
